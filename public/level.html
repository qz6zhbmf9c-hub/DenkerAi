<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose your level - DenkerAI</title>
  <meta name="description" content="Learn German with AI-made flashcards and spaced repetition.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar" id="topbar"></header>
  <main>
    <div class="level-wrap">
      <svg class="mascot" viewBox="0 0 120 120" aria-hidden="true"><use href="#mascot"/></svg>
      <div class="glass-panel" style="padding:40px">
        <h2 class="center">What is your German level?</h2>
        <div id="level-options" style="margin-top:32px" role="radiogroup" aria-label="German level"></div>
        <div class="error-text center" id="err-level" role="alert"></div>
        <div class="center" style="margin-top:24px">
          <button class="btn-primary" id="btn-continue" type="button" disabled>Continue</button>
        </div>
      </div>
    </div>
  </main>
  <div class="overlay" id="loading-modal" role="alertdialog" aria-live="polite" aria-label="Loading">
    <div class="glass-panel modal-box">
      <svg class="mascot" viewBox="0 0 120 120" aria-hidden="true"><use href="#mascot"/></svg>
      <h3 id="loading-text">Denki is working...</h3>
    </div>
  </div>
  <script type="module" src="/js/level.js"></script>
</body>
</html>
